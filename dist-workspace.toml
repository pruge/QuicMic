[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax): x86_64 + arm64
# for Linux, Windows, and macOS. The lock-free ring buffer and resampler are
# already tuned for weak-memory-model (ARM) CPUs, so arm64 is a first-class target
# across all three OSes. cargo-dist picks current runners per target (e.g.
# macos-15-intel for x86_64 macOS).
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Where to host releases
hosting = "github"
# `dist` has no built-in crates.io publisher (it ships binaries, not source
# packages), so publishing the crate is a custom publish job
# (.github/workflows/publish-crates.yml). dist runs it at the publish stage — after
# the binaries are built and the GitHub Release exists — so a failed build never
# burns an immutable crates.io version. Needs a CARGO_REGISTRY_TOKEN repo secret.
publish-jobs = ["./publish-crates"]

# Build arm64 Windows natively on GitHub's ARM Windows runner (free for public
# repos) instead of cargo-dist's default of cross-compiling it from Linux via
# cargo-xwin — a native MSVC build is more reliable (esp. for `ring`'s assembly).
[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"

# cpal links against ALSA on Linux, so the build needs its development headers.
[dist.dependencies.apt]
libasound2-dev = '*'

# Generate the third-party license attribution (cargo-about) and attach it to the
# GitHub Release as an asset.
[[dist.extra-artifacts]]
artifacts = ["THIRD-PARTY-LICENSES.html"]
build = [
    "sh",
    "-c",
    "cargo install cargo-about --locked --features cli && cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html",
]

# The generated caller grants the publish job only `id-token`/`packages`, and any scope
# left out of a job's `permissions:` block defaults to `none` — which would leave
# `actions/checkout` without `contents: read`. Restore it (and keep `id-token: write`,
# which Trusted Publishing's OIDC exchange needs).
[dist.github-custom-job-permissions.publish-crates]
id-token = "write"
contents = "read"
