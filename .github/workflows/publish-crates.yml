# Custom `dist` publish job: publishes the crate to crates.io as part of the
# release pipeline.
#
# `dist` has no built-in crates.io publisher (it distributes binaries, not source
# packages), but it does support custom publish jobs. This one is wired in from
# `dist-workspace.toml` via `publish-jobs = ["./publish-crates"]`, so it runs at the
# publish stage — after the binaries are built and the GitHub Release is created.
# That ordering matters: a failed build therefore never burns an immutable
# crates.io version (a published version can only be yanked, never replaced).
#
# Auth is **Trusted Publishing** (OIDC): there is no long-lived `CARGO_REGISTRY_TOKEN`
# secret in this repository, so there is nothing durable for an attacker to steal.
# `crates-io-auth-action` exchanges GitHub's OIDC identity for a crates.io token that
# expires within minutes. The trust relationship is configured on crates.io itself
# (crate -> Settings -> Trusted Publishing: this repository + this workflow file).
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      # `dist` passes its release plan (dist-manifest JSON) to every custom job.
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The verification build below compiles the crate, and cpal needs the ALSA
      # development headers on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Verify that the PACKAGED crate — whatever `exclude` actually leaves behind —
      # builds on its own. This is NOT redundant with dist's build: dist builds from the
      # full repo checkout, so it can never catch an `exclude` that drops something the
      # build needs (e.g. `web/`, which rust-embed embeds at compile time). A broken
      # crates.io version can only be yanked, never replaced, so this check earns its keep.
      #
      # It deliberately runs with NO token in the environment. This step executes every
      # dependency's build script, and a GitHub secret is only visible to the step that
      # declares it — so a malicious dependency has nothing to steal here.
      - name: Verify the packaged crate builds
        run: cargo package --locked

      # Mint a short-lived credential (minutes), valid only for this run.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Upload only. `--no-verify` skips a second build — the packaging step above already
      # proved it compiles — which is also what keeps dependency build scripts out of the
      # one step that holds the token.
      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
