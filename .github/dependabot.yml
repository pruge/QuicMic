# Dependabot configuration.
#
# Routine version-update PRs are disabled (open-pull-requests-limit: 0) so there
# is no "a new version is available" PR spam on every minor bump. Security
# updates are NOT affected by this limit — to receive PRs only for dependencies
# with a known vulnerability, enable "Dependabot security updates" in the
# repository's Settings -> Code security and analysis.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
